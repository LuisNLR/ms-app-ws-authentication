### Configuracion de conexion INTERNA RENDER a PostgreSQL
spring.datasource.url=jdbc:postgresql://dpg-d9nvbn3m8hqs73f5f7ag-a:5432/db_segu_ctrl
spring.datasource.username=usr_db_tram_docu
spring.datasource.password=${CONE_DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# Opcional: configuracion de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima


spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000


###Contexto y puerto del servicio ms-app-ws-authentication
server.servlet.context-path=/ms-app-ws-authentication
server.port=8093

spring.security.enabled=false

