###Cadena de conexion a Base de Datos REMOTE
spring.datasource.url=jdbc:mariadb://192.168.18.81:3306/db_segu_ctrl?serverTimezone=America/Lima
spring.datasource.username=adminMDB
spring.datasource.password=adminMariaBD
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.jpa.show-sql=false

###Contexto y puerto del servicio ms-app-ws-authentication
server.servlet.context-path=/ms-app-ws-authentication
server.port=8093

spring.security.enabled=false

